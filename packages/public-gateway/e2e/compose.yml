name: noodle-gateway-e2e
services:
  server:
    image: ghcr.io/open-noodle/gallery-server:release
    volumes: ['./library:/data']
    env_file: [.env]
    ports: ['127.0.0.1:22830:2283']
    depends_on: [redis, database]
    restart: on-failure
  redis:
    image: docker.io/valkey/valkey:9@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      {
        POSTGRES_PASSWORD: postgres,
        POSTGRES_USER: postgres,
        POSTGRES_DB: immich,
        POSTGRES_INITDB_ARGS: '--data-checksums',
      }
    shm_size: 128mb
