# Noodle public gateway configuration. Reload with `kill -HUP <pid>` (or `docker kill -s HUP <container>`).

# The Noodle server, as reachable from the gateway
upstream: http://gallery-server:2283

listen:
  host: 0.0.0.0
  port: 8080

# Set to true only when an edge proxy (Caddy, Traefik, nginx) in front of the gateway sets X-Forwarded-For
trustProxy: true

# Largest request body accepted for the read-only POSTs (search)
maxBodyBytes: 65536

# Per visitor and gallery. `expensive` covers smart search (runs the ML model), metadata/random search and archive
# downloads. A timeline page loads one thumbnail per photo on screen, so keep `default` generous. perSecond: 0 disables.
rateLimit:
  default: { perSecond: 100, burst: 400 }
  expensive: { perSecond: 1, burst: 10 }

# Search engines are told not to index the galleries (X-Robots-Tag) unless this is true
allowIndexing: false

# An admin's API key with adminUser.read/create/update, sharedSpace.read/create and sharedSpaceMember.create.
# Needed only for galleries described by `name` and `spaces`, which the gateway creates itself.
adminApiKeyFile: /etc/public-gateway/admin.key
# where the gateway keeps the keys of the gallery users it creates (mount a volume here)
stateDir: /var/lib/public-gateway

# Edits to this file apply on their own within seconds.
galleries:
  # Provisioned: the gateway creates the user familia@public-gallery.local, makes it a Viewer of the Spaces
  # (creating missing ones, empty) and issues its read-only key
  - name: Família
    hosts: [familia.example.com, familia.localhost]
    spaces: [Família, Viagens]
    features: { people: true }

  # Manual: a read-only API key you created yourself for a dedicated Noodle user
  - host: gal-publica1.example.com
    apiKeyFile: /run/secrets/gal1_key # relative paths resolve against this file's directory
    title: Família Silva
    features:
      people: true # people and face recognition (names and faces become public)
      map: true # map and place search
      smartSearch: true
      downloadOriginal: false

  - host: gal-pub2.example.com
    apiKeyFile: /run/secrets/gal2_key
    # every feature defaults to off except smartSearch
